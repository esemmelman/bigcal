<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BigCal · DayFlow year ahead</title></head>
<body>
<header><div><p class="eyebrow">DAYFLOW / YEAR AHEAD</p><h1>BigCal</h1><p id="range"></p></div><div class="actions"><button id="refresh">Refresh</button><button id="account">Sign in</button></div></header>
<main><div class="summary"><div class="search"><input id="search" type="search" placeholder="Search events" aria-label="Search event titles and notes" autocomplete="off"><span id="search-status" role="status" aria-live="polite"></span></div><label class="import">Open DayFlow backup<input id="import" type="file" accept=".json,application/json"></label></div>
<p id="status" role="status" aria-live="polite" hidden></p>
<div id="calendar" tabindex="0" role="region" aria-label="October 2026 through December 2027"></div></main>
<div id="date-events" role="region" aria-label="Events for selected date" hidden></div>
<dialog id="event-dialog" aria-labelledby="event-title"><h2 id="event-title"></h2><div id="event-details"><p id="event-date"></p><p id="event-time"></p><div id="event-notes"></div></div>
<form id="event-form" hidden><fieldset id="event-fields"><label>Title<input id="edit-title" maxlength="500" required></label><label>Date<input id="edit-date" type="date" required></label><label class="checkbox"><input id="edit-allday" type="checkbox">All day</label><div id="edit-times"><label>Start time<input id="edit-start" type="time"></label><label>End time<input id="edit-end" type="time"></label></div><label>Notes<textarea id="edit-notes" rows="5"></textarea></label></fieldset><div class="actions"><button id="event-save" type="submit">Save</button><button id="edit-cancel" type="button">Cancel editing</button></div></form>
<p id="event-error" role="alert"></p><p id="event-confirm" hidden>Delete this event from DayFlow? This cannot be undone.</p><div class="actions"><button id="event-edit" type="button">Edit</button><button id="event-delete" type="button">Delete</button><button id="delete-confirm" type="button" hidden>Delete permanently</button><button id="delete-cancel" type="button" hidden>Keep event</button><button id="event-close" type="button">Close</button></div></dialog>
<dialog id="auth"><form id="login"><h2>Connect to DayFlow</h2><p>Use the same account you use in DayFlow.</p><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><p id="auth-error" role="alert"></p><div class="actions"><button type="button" id="cancel">Cancel</button><button id="submit" type="submit">Sign in</button></div></form></dialog>
<script type="module" src="/src/app.js"></script></body></html>
